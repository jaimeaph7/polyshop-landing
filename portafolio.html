<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Portafolio — Poly Shop3D</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--black:#0A0A0A;--white:#FFFFFF;--gray-1:#6B6B6B;--gray-3:#F7F7F7;--line:#DEDEDE;--green:#1F8A4C;--green-dark:#14602F;--ease:cubic-bezier(.16,1,.3,1);}
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--white);color:var(--black);font-family:'Inter',sans-serif;-webkit-font-smoothing:antialiased;}
  h1,h2{font-family:'Space Grotesk',sans-serif;font-weight:700;letter-spacing:-0.03em;}
  a{color:inherit;text-decoration:none;}
  .wrap{max-width:1240px;margin:0 auto;padding:0 32px;}
  @media (max-width:640px){.wrap{padding:0 20px;}}
  header{position:sticky;top:0;z-index:100;background:rgba(255,255,255,.9);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);}
  nav{display:flex;align-items:center;justify-content:space-between;height:76px;}
  .logo{font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:20px;}
  .logo span{color:var(--green);font-weight:500;}
  .back{font-size:13.5px;font-weight:600;color:var(--gray-1);}
  .back:hover{color:var(--black);}
  main{padding:80px 0 120px;}
  .kicker{font-size:13px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--green);margin-bottom:16px;display:block;}
  h1{font-size:clamp(2.2rem,4.6vw,3.4rem);max-width:760px;margin-bottom:20px;}
  .lead{color:var(--gray-1);font-size:16px;max-width:520px;line-height:1.6;margin-bottom:64px;}
  .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:24px;}
  .item{aspect-ratio:4/5;border-radius:16px;background:var(--gray-3);border:1px solid var(--line);position:relative;overflow:hidden;display:flex;align-items:flex-end;padding:22px;}
  .item .grid-bg{position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px, transparent 1px),linear-gradient(90deg, var(--line) 1px, transparent 1px);background-size:26px 26px;opacity:.55;}
  .item span{position:relative;font-size:12.5px;font-weight:600;color:var(--gray-1);background:var(--white);padding:6px 12px;border-radius:100px;border:1px solid var(--line);}
  @media (max-width:800px){.grid{grid-template-columns:repeat(2,1fr);}}
  @media (max-width:520px){.grid{grid-template-columns:1fr;}}
</style>
</head>
<body>
<header><div class="wrap"><nav>
  <a href="index.html" class="logo">Poly<span>Shop3D</span></a>
  <a href="index.html" class="back">← Volver al inicio</a>
</nav></div></header>

<main>
  <div class="wrap">
    <span class="kicker">Portafolio</span>
    <h1>Animación y render 3D</h1>
    <p class="lead">Trabajo previo en animación, producción comercial y render 3D — la base técnica detrás de cada configurador que construimos.</p>

    <div class="grid">
      <div class="item"><div class="grid-bg"></div><span>Render 01</span></div>
      <div class="item"><div class="grid-bg"></div><span>Animación 02</span></div>
      <div class="item"><div class="grid-bg"></div><span>Render 03</span></div>
      <div class="item"><div class="grid-bg"></div><span>Animación 04</span></div>
      <div class="item"><div class="grid-bg"></div><span>Render 05</span></div>
      <div class="item"><div class="grid-bg"></div><span>Animación 06</span></div>
    </div>
  </div>
</main>
</body>
</html>
